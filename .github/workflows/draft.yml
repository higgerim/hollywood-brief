name: 1. 초안 만들기

on:
  schedule:
    - cron: "0 21 * * 0,2,4"   # 한국 시간 월·수·금 오전 6시
  workflow_dispatch:            # Actions 탭에서 수동 실행

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 라이브러리 설치
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
          npm install -g @anthropic-ai/claude-code

      - name: 기사 수집 → 원고 작성 → 카드 생성
        id: draft
        run: python -m hbrief draft
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}   # engine: claude-code (구독)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}               # engine: api (별도 결제)

      - name: 검토용 PR 올리기
        uses: peter-evans/create-pull-request@v7
        with:
          branch: draft/${{ steps.draft.outputs.issue_date }}
          add-paths: drafts/
          commit-message: "초안: ${{ steps.draft.outputs.issue_date }}"
          title: "[검토] ${{ steps.draft.outputs.issue_date }} — ${{ steps.draft.outputs.issue_title }}"
          body: |
            새 초안이 준비됐어요. 아래 링크 두 개로 먼저 훑어보세요.

            **👀 미리보기 (지금 바로 열려요)**
            - [카드뉴스 8장 한눈에 보기](https://github.com/${{ github.repository }}/blob/draft/${{ steps.draft.outputs.issue_date }}/drafts/${{ steps.draft.outputs.issue_date }}/README.md)
            - [뉴스레터 미리보기](https://raw.githack.com/${{ github.repository }}/draft/${{ steps.draft.outputs.issue_date }}/drafts/${{ steps.draft.outputs.issue_date }}/newsletter.html)

            **검토 체크리스트**
            - [ ] 카드에 사실과 다른 내용이나 어색한 문장이 없는지
            - [ ] "루머" 표시가 필요한 이슈에 제대로 붙었는지
            - [ ] 인물을 비하하거나 선을 넘는 표현이 없는지
            - [ ] 이미지가 소식과 맞는지 (바꾸려면 `content.json`의 `image_people`·`image_focus`·`image_work` 수정)
            - [ ] 뉴스레터 본문과 출처 링크

            **고치는 방법:** **Files changed** 탭에서 `content.json`을 수정해서 커밋하면 1~2분 뒤 카드와 본문이 자동으로 다시 만들어져요.
            **발행 순서 (메일리 먼저, 인스타 나중)**
            1. 위 **뉴스레터 미리보기**를 열어 안내 상자 아래부터 끝까지 복사 → 메일리 에디터에 붙여넣고 **발행**해요. 사진과 링크가 함께 옮겨져요.
            2. 그다음 맨 아래 **Merge pull request**를 누르면 인스타그램에 자동으로 게시돼요.
            인스타 프로필 링크(메일리 홈)의 맨 위 글이 오늘 호가 되도록, 꼭 메일리를 먼저 발행해 주세요.
            **이번 호 건너뛰기:** 맨 아래 **Close pull request**를 누르세요.
