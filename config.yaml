# 소식지 기본 설정 — 이름, 핸들, 수집 매체를 여기서 바꿔요.

brand:
  name: "할리우드 브리핑"          # 소식지 이름 (정해지면 바꾸세요)
  name_en: "HOLLYWOOD BRIEF"
  instagram_handle: "@hollywood.brief"   # 인스타그램 계정 핸들
  newsletter_url: "https://maily.so/"    # 메일리 구독 페이지 주소

# 몇 시간 전 기사까지 모을지 (주 3회 발행이라 약 3일)
lookback_hours: 72

# 한 호에 담을 이슈 개수 (인스타 캐러셀 10장 제한: 표지 + 이슈 + 마무리)
stories_per_issue: 6

# 원고 작성 방식
#   claude-code : Claude 구독 계정 사용 (추가 비용 없음, 구독 사용 한도를 같이 씀)
#   api         : Claude API 키 사용 (쓴 만큼 별도 결제, 약 $0.3~0.5/회)
engine: "claude-code"
claude_code_model: "opus"
api_model: "claude-opus-5"

feeds:
  - { name: "TMZ", url: "https://www.tmz.com/rss.xml" }
  - { name: "Variety", url: "https://variety.com/feed/" }
  - { name: "Deadline", url: "https://deadline.com/feed/" }
  - { name: "The Hollywood Reporter", url: "https://www.hollywoodreporter.com/feed/" }
  - { name: "Page Six", url: "https://pagesix.com/feed/" }
  - { name: "E! News", url: "https://www.eonline.com/syndication/feeds/rssfeeds/topstories.xml" }
  - { name: "Just Jared", url: "https://www.justjared.com/feed/" }

# 레딧 반응 — 화제성 판단에만 쓰고, 출처로는 쓰지 않아요
reddit:
  - { name: "r/entertainment", url: "https://www.reddit.com/r/entertainment/top/.rss?t=day" }
  - { name: "r/Fauxmoi", url: "https://www.reddit.com/r/Fauxmoi/top/.rss?t=day" }
  - { name: "r/popculturechat", url: "https://www.reddit.com/r/popculturechat/top/.rss?t=day" }

instagram:
  api_version: "v25.0"
